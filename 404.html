<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada — Areté</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/icon-32.png">
<style>
  :root{--bg:#f4f2f0;--ink:#1c1b1b;--soft:rgba(93,63,59,.62);--line:rgba(92,68,64,.10);--accent:#d4372c;--action:#1c1b1b;--action-ink:#fff}
  @media (prefers-color-scheme:dark){:root{--bg:#131313;--ink:#e5e2e1;--soft:rgba(231,189,183,.60);--line:rgba(231,189,183,.10);--accent:#ff5545;--action:#e5e2e1;--action-ink:#131313}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:17px/1.6 'Inter',-apple-system,system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
  img{width:72px;height:72px;border-radius:18px}
  h1{font-size:clamp(2rem,6vw,3rem);line-height:1.1;letter-spacing:-.03em;margin:22px 0 10px}
  p{color:var(--soft);margin:0 auto;max-width:42ch}
  .row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:30px}
  a{font-weight:600;text-decoration:none;border-radius:999px;padding:13px 24px}
  .main{background:var(--action);color:var(--action-ink)}
  .alt{color:var(--ink);border:1px solid var(--line)}
</style>
</head>
<body>
  <main>
    <img src="/assets/icons/icon-192.png" alt="Areté">
    <h1>Esta página no existe.</h1>
    <p>El enlace está mal escrito o la página se movió. Lo que buscabas seguramente está en la app o en el blog.</p>
    <div class="row">
      <a class="main" href="/app.html">Abrir la app</a>
      <a class="alt" href="/">Ir al inicio</a>
      <a class="alt" href="/blog/index.html">Blog</a>
    </div>
  </main>
</body>
</html>
