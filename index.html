<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Areté se ha mudado</title>
<link rel="canonical" href="https://arete.raiatech.com/">
<meta name="robots" content="noindex">
<!-- Sin JS, el meta refresh se lleva al menos la portada. Con JS, el script de
     abajo conserva la ruta y limpia el service worker antes de saltar. -->
<meta http-equiv="refresh" content="3;url=https://arete.raiatech.com/">
<style>
  :root{color-scheme:light dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
       font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;
       background:#faf9f7;color:#1c1a17;text-align:center}
  @media (prefers-color-scheme:dark){body{background:#14120f;color:#f0ece6}}
  h1{font-size:1.5rem;margin:0 0 8px;letter-spacing:-.02em}
  p{margin:0 0 20px;opacity:.75;max-width:34ch}
  a{display:inline-block;padding:12px 22px;border-radius:10px;
    background:#1c1a17;color:#faf9f7;text-decoration:none;font-weight:600}
  @media (prefers-color-scheme:dark){a{background:#f0ece6;color:#14120f}}
</style>
</head>
<body>
<main>
  <h1>Areté está ahora en arete.raiatech.com</h1>
  <p>Te llevo en un momento. Tus datos están en tu dispositivo y siguen ahí: no se pierde nada con el cambio.</p>
  <a id="ir" href="https://arete.raiatech.com/">Ir a Areté</a>
</main>
<script>
(function () {
  var DESTINO = 'https://arete.raiatech.com';
  // La ruta se conserva: /arete/blog/8-dominios.html no puede acabar en la portada.
  // Este sitio se sirve como project page, así que todo cuelga de /arete.
  var ruta = location.pathname.replace(/^\/arete\/?/, '/') || '/';
  var url = DESTINO + ruta + location.search + location.hash;
  document.getElementById('ir').href = url;

  // Quien instaló la PWA desde aquí tiene un service worker registrado en ESTE
  // origen, sirviendo la app cacheada. Sin desregistrarlo seguiría abriendo una
  // copia congelada del 24-08-2026 para siempre, sin enterarse de que existe un
  // sitio nuevo. Se retira antes de saltar; si algo falla, se salta igual.
  var limpiar = Promise.resolve();
  try {
    if ('serviceWorker' in navigator) {
      limpiar = navigator.serviceWorker.getRegistrations()
        .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })
        .then(function () { return 'caches' in window ? caches.keys() : []; })
        .then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })
        .catch(function () {});
    }
  } catch (e) {}
  // Un fallo en la limpieza no puede dejar a nadie atrapado en esta página.
  var saltar = function () { location.replace(url); };
  limpiar.then(saltar, saltar);
  setTimeout(saltar, 2500);
})();
</script>
</body>
</html>
