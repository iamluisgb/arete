<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarjeta de perfil — prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;0,800;0,900&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0b0b0b; --fg: #f2f2f2; --sub: #9a9a9a; --line: #262626; --chip: #1a1a1a; --ink: #f2f2f2; --ink-fg: #0b0b0b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 Inter, system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr) 320px; align-items: start; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.note { color: var(--sub); margin: 0 0 16px; font-size: 13px; }
  .stage { display: grid; place-items: center; padding: 16px; border: 1px solid var(--line); border-radius: 12px;
    background: repeating-conic-gradient(#161616 0 25%, #1d1d1d 0 50%) 0 0 / 24px 24px; }
  canvas { max-width: 100%; max-height: 78vh; height: auto; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .panel { display: grid; gap: 18px; }
  fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
  legend { font-size: 12px; color: var(--sub); text-transform: lowercase; margin-bottom: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--chip); color: var(--fg); cursor: pointer; }
  .chips button[aria-pressed="true"] { background: var(--fg); color: var(--bg); font-weight: 600; }
  .actions { display: grid; gap: 8px; }
  .actions button { font: inherit; font-weight: 600; padding: 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--chip); color: var(--fg); cursor: pointer; }
  .actions button.primary { background: var(--ink); color: var(--ink-fg); border-color: var(--ink); }
  .actions button:disabled { opacity: .5; cursor: wait; }
</style>
</head>
<body>
<main>
  <section>
    <h1>Tarjeta de perfil</h1>
    <p class="note">Prototipo con perfiles de ejemplo. Los dominios, niveles y nombres salen de <code>js/domains.js</code>.</p>
    <div class="stage"><canvas id="card" width="1080" height="1920"></canvas></div>
  </section>
  <aside class="panel">
    <fieldset><legend>Perfil de ejemplo</legend><div class="chips" data-key="sample"></div></fieldset>
    <fieldset><legend>Momento</legend><div class="chips" data-key="moment"></div></fieldset>
    <fieldset><legend>Formato</legend><div class="chips" data-key="format"></div></fieldset>
    <fieldset><legend>Tema</legend><div class="chips" data-key="theme"></div></fieldset>
    <div class="actions">
      <button class="primary" id="btnShare">Compartir</button>
      <button id="btnPlay">Reproducir animación</button>
      <button id="btnVideo">Descargar vídeo (4 s)</button>
      <button id="btnPng">Descargar imagen</button>
    </div>
  </aside>
</main>

<script type="module">
import { DOMAINS, ROMAN, LEVEL_NAMES } from './js/domains.js';

const FONT = "Inter, -apple-system, system-ui, sans-serif";
const URL_TXT = 'arete.raiatech.com';

// Niveles por dominio en el orden de DOMAINS. 0 = sin medir.
const SAMPLES = {
  hibrido:   { name: 'Híbrido cojo',  levels: { strength: 4, pull: 3, glyco: 3, cardio: 4, kb: 3, core: 4, mobility: 2 } },
  corredor:  { name: 'Corredor',      levels: { strength: 1, pull: 2, glyco: 4, cardio: 5, kb: 2, core: 3, mobility: 3 } },
  incompleto:{ name: 'Provisional',   levels: { strength: 3, pull: 4, glyco: 0, cardio: 3, kb: 0, core: 0, mobility: 0 } },
};
// La subida de nivel parte del perfil elegido y sube su eslabón débil uno.
const MOMENTS = { perfil: 'Perfil', subida: 'Subida de nivel' };
const FORMATS = {
  story:   { name: '9:16',     W: 1080, H: 1920 },
  square:  { name: '1:1',      W: 1080, H: 1080 },
  sticker: { name: 'Adhesivo', W: 1080, H: 1080 },
};
const THEMES = {
  dark: {
    bg: ['#0f0f0f', '#181818', '#0b0b0b'], text: '#ffffff', sub: o => `rgba(255,255,255,${o})`,
    accent: '#ff5545', accentSoft: 'rgba(255,85,69,.18)', glow: 'rgba(212,55,44,.10)',
    fill: 'rgba(255,255,255,.14)', stroke: 'rgba(255,255,255,.9)', ring: 'rgba(255,255,255,.09)',
  },
  light: {
    bg: ['#f5f5f7', '#ffffff', '#efeff2'], text: '#1d1d1f', sub: o => `rgba(0,0,0,${o})`,
    accent: '#d4372c', accentSoft: 'rgba(212,55,44,.14)', glow: 'rgba(212,55,44,.07)',
    fill: 'rgba(0,0,0,.08)', stroke: 'rgba(0,0,0,.85)', ring: 'rgba(0,0,0,.09)',
  },
};
// El adhesivo va encima de una foto cualquiera: texto blanco con sombra, sin fondo.
const STICKER = { ...THEMES.dark, sub: () => '#ffffff', fill: 'rgba(255,255,255,.22)', ring: 'rgba(255,255,255,.28)' };

const state = { sample: 'hibrido', moment: 'perfil', format: 'story', theme: 'dark' };
try { Object.assign(state, JSON.parse(localStorage.getItem('aretePerfilProto') || '{}')); } catch {}

// ── Modelo: lo mismo que computeProfile, reducido a niveles ──

function profileFrom(levels) {
  const measured = DOMAINS.filter(d => levels[d.id] > 0);
  const global = measured.length ? Math.min(...measured.map(d => levels[d.id])) : 0;
  const weak = measured.filter(d => levels[d.id] === global);
  return { levels, global, weak, provisional: measured.length < DOMAINS.length };
}

function currentProfiles() {
  const base = profileFrom(SAMPLES[state.sample].levels);
  if (state.moment !== 'subida' || !base.weak.length) return { now: base, before: null, raised: null };
  const raised = base.weak[0];
  const now = profileFrom({ ...base.levels, [raised.id]: Math.min(5, base.levels[raised.id] + 1) });
  return { now, before: base, raised };
}

// ── Dibujo ───────────────────────────────────────────────

const ease = t => 1 - Math.pow(1 - Math.min(1, Math.max(0, t)), 3);
const span = (t, a, b) => ease((t - a) / (b - a));

function text(ctx, s, x, y, { size = 32, weight = 600, color, align = 'center', spacing = 0, italic = false, alpha = 1 } = {}) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.font = `${weight} ${size}px ${FONT}`;
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.letterSpacing = `${spacing}em`;
  if (italic) { ctx.transform(1, 0, -0.14, 1, 0, 0); x += y * 0.14; }
  ctx.fillText(s, x, y);
  ctx.restore();
}

function textWidth(ctx, s, size, weight, spacing = 0) {
  ctx.save();
  ctx.font = `${weight} ${size}px ${FONT}`;
  ctx.letterSpacing = `${spacing}em`;
  const w = ctx.measureText(s).width;
  ctx.restore();
  return w;
}

function pill(ctx, s, x, y, { bg, color, align = 'left', size = 24 }) {
  const w = textWidth(ctx, s.toUpperCase(), size, 700, 0.08) + size * 1.8, h = size * 1.8;
  const left = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  ctx.beginPath(); ctx.roundRect(left, y, w, h, h / 2); ctx.fillStyle = bg; ctx.fill();
  text(ctx, s.toUpperCase(), left + w / 2, y + h / 2 + 1, { size, weight: 700, color, spacing: 0.08 });
}

function angle(i) { return -Math.PI / 2 + i * 2 * Math.PI / DOMAINS.length; }
function pt(cx, cy, r, i) { return [cx + r * Math.cos(angle(i)), cy + r * Math.sin(angle(i))]; }

function polygon(ctx, pts) {
  ctx.beginPath();
  pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
  ctx.closePath();
}

/** El heptágono. `t` va de 0 a 1 a lo largo de la animación. */
function radar(ctx, cx, cy, R, { now, before, raised }, th, t, { labels = true, labelSize = 28 } = {}) {
  const weakIds = new Set(now.weak.map(d => d.id));
  const rFor = lvl => R * (lvl > 0 ? lvl : 0.12) / 5;

  // Anillos I..V y radios
  const ringA = span(t, 0, 0.25);
  ctx.save(); ctx.globalAlpha = ringA;
  for (let k = 1; k <= 5; k++) {
    polygon(ctx, DOMAINS.map((_, i) => pt(cx, cy, R * k / 5, i)));
    ctx.strokeStyle = th.ring; ctx.lineWidth = k === 5 ? 2.5 : 1.5; ctx.stroke();
  }
  DOMAINS.forEach((d, i) => {
    const [x, y] = pt(cx, cy, R, i);
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x, y);
    ctx.setLineDash(now.levels[d.id] ? [] : [6, 8]);
    ctx.strokeStyle = th.ring; ctx.lineWidth = 1.5; ctx.stroke();
  });
  ctx.setLineDash([]);
  ctx.restore();

  // Forma de antes, discontinua, para que la subida se vea
  if (before) {
    ctx.save(); ctx.globalAlpha = span(t, 0.15, 0.35) * 0.8;
    polygon(ctx, DOMAINS.map((d, i) => pt(cx, cy, rFor(before.levels[d.id]), i)));
    ctx.setLineDash([10, 10]); ctx.strokeStyle = th.sub(.45); ctx.lineWidth = 3; ctx.stroke();
    ctx.restore();
  }

  // La forma: cada eje crece con un pequeño desfase
  const shape = DOMAINS.map((d, i) => {
    if (before) {
      const g = d.id === raised?.id ? span(t, 0.45, 0.75) : 1;
      return pt(cx, cy, rFor(before.levels[d.id] + (now.levels[d.id] - before.levels[d.id]) * g), i);
    }
    return pt(cx, cy, rFor(now.levels[d.id]) * span(t, 0.15 + i * 0.03, 0.55 + i * 0.03), i);
  });
  // Un dominio sin medir no es nivel 0: la forma pasa solo por los medidos,
  // o hundiría el eje en el centro y se leería como debilidad.
  polygon(ctx, shape.filter((_, i) => now.levels[DOMAINS[i].id]));
  ctx.fillStyle = th.fill; ctx.fill();
  ctx.lineJoin = 'round'; ctx.strokeStyle = th.stroke; ctx.lineWidth = 4; ctx.stroke();

  // Vértices; el eslabón débil (o el que sube) late en rojo
  const pulse = t >= 0.7 ? 0.5 + 0.5 * Math.sin((t - 0.7) * 18) : 0;
  DOMAINS.forEach((d, i) => {
    if (!now.levels[d.id]) return;
    const [x, y] = shape[i];
    const hot = before ? d.id === raised?.id : weakIds.has(d.id);
    if (hot && t >= 0.6) {
      ctx.beginPath(); ctx.arc(x, y, 22 + 14 * pulse, 0, Math.PI * 2);
      ctx.fillStyle = th.accentSoft; ctx.fill();
    }
    ctx.beginPath(); ctx.arc(x, y, hot ? 13 : 9, 0, Math.PI * 2);
    ctx.fillStyle = hot ? th.accent : th.stroke; ctx.fill();
  });

  if (!labels) return;
  const la = span(t, 0.3, 0.6);
  DOMAINS.forEach((d, i) => {
    const a = angle(i), c = Math.cos(a), s = Math.sin(a);
    const [x, y] = pt(cx, cy, R + labelSize * 2.1, i);
    const align = Math.abs(c) < 0.2 ? 'center' : c > 0 ? 'left' : 'right';
    const dy = s < -0.9 ? -labelSize * 0.9 : s > 0.6 ? labelSize * 0.5 : 0;
    const lvl = now.levels[d.id];
    const hot = before ? d.id === raised?.id : weakIds.has(d.id);
    text(ctx, d.short, x, y + dy - labelSize * 0.62, { size: labelSize, weight: 600, color: hot ? th.accent : th.sub(.6), align, alpha: la });
    const val = before && d.id === raised?.id ? `${ROMAN[before.levels[d.id]]} → ${ROMAN[lvl]}` : lvl ? ROMAN[lvl] : '—';
    text(ctx, val, x, y + dy + labelSize * 0.68, { size: labelSize * 1.3, weight: 800, color: hot ? th.accent : th.text, align, alpha: la });
  });
}

function background(ctx, W, H, th) {
  const g = ctx.createLinearGradient(0, 0, W * 0.3, H);
  th.bg.forEach((c, i) => g.addColorStop(i / (th.bg.length - 1), c));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const r = ctx.createRadialGradient(W / 2, H * 0.5, 0, W / 2, H * 0.5, W * 0.8);
  r.addColorStop(0, th.glow); r.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = r; ctx.fillRect(0, 0, W, H);
}

function brand(ctx, x, y, th, align = 'right', size = 30) {
  text(ctx, 'ARETÉ', x, y, { size, weight: 800, color: th.accent, align, spacing: 0.1, italic: true });
}

const monthYear = () => new Date().toLocaleDateString('es-ES', { month: 'short', year: 'numeric' }).replace('.', '');
const weakNames = p => p.weak.map(d => d.name).join(' · ');

// Lo que dice la tarjeta, según el momento
function copy({ now, before, raised }) {
  if (before) {
    const up = now.global > before.global;
    return {
      kicker: 'Subida de nivel',
      hero: ROMAN[up ? now.global : now.levels[raised.id]],
      heroName: up ? LEVEL_NAMES[now.global] : raised.name,
      lineLabel: up ? 'Ya no me frena' : 'Sube',
      line: up ? raised.name : `${ROMAN[before.levels[raised.id]]} → ${ROMAN[now.levels[raised.id]]}`,
      cta: '¿En qué nivel estás tú?',
    };
  }
  const measured = DOMAINS.filter(d => now.levels[d.id]).length;
  return {
    kicker: `Perfil · ${monthYear()}`,
    hero: ROMAN[now.global],
    heroName: LEVEL_NAMES[now.global],
    note: now.provisional ? `Provisional · ${measured} de ${DOMAINS.length} dominios medidos` : '',
    lineLabel: now.weak.length > 1 ? 'Mis eslabones débiles' : 'Mi eslabón débil',
    line: weakNames(now),
    cta: '¿Cuál es el tuyo?',
  };
}

// Encoge el texto hasta que cabe en el ancho dado.
function fit(ctx, s, max, size, weight) {
  while (size > 24 && textWidth(ctx, s, size, weight) > max) size -= 2;
  return size;
}

function renderStory(ctx, W, H, P, th, t) {
  background(ctx, W, H, th);
  const c = copy(P);
  pill(ctx, c.kicker, 64, 60, P.before ? { bg: th.accent, color: '#fff' } : { bg: th.sub(.07), color: th.sub(.65) });
  brand(ctx, W - 64, 102, th);

  const a = span(t, 0.55, 0.8);
  text(ctx, 'mi nivel', W / 2, 220, { size: 32, weight: 600, color: th.sub(.5), spacing: 0.04, alpha: a });
  text(ctx, c.hero, W / 2, 360, { size: 220, weight: 900, color: th.text, italic: true, alpha: a });
  text(ctx, c.heroName, W / 2, 505, { size: fit(ctx, c.heroName, W - 160, 64, 800), weight: 800, color: th.accent, italic: true, alpha: a });
  if (c.note) text(ctx, c.note, W / 2, 565, { size: 26, weight: 600, color: th.sub(.5), alpha: a });

  radar(ctx, W / 2, 1050, 270, P, th, t, { labelSize: 30 });

  const b = span(t, 0.7, 0.95);
  text(ctx, c.lineLabel.toLowerCase(), W / 2, 1490, { size: 30, weight: 600, color: th.sub(.5), spacing: 0.04, alpha: b });
  text(ctx, c.line, W / 2, 1550, { size: fit(ctx, c.line, W - 140, 60, 800), weight: 800, color: th.text, alpha: b });
  text(ctx, 'Tu nivel es el de tu dominio más bajo.', W / 2, 1615, { size: 28, weight: 400, color: th.sub(.5), alpha: b });

  const d = span(t, 0.85, 1);
  ctx.save(); ctx.globalAlpha = d;
  ctx.beginPath(); ctx.roundRect(64, 1695, W - 128, 150, 28); ctx.fillStyle = th.sub(.06); ctx.fill();
  ctx.restore();
  text(ctx, c.cta, W / 2, 1750, { size: 40, weight: 800, color: th.text, alpha: d });
  text(ctx, `Mide tus 7 dominios en ${URL_TXT}`, W / 2, 1803, { size: 26, weight: 600, color: th.accent, alpha: d });
}

function renderSquare(ctx, W, H, P, th, t) {
  background(ctx, W, H, th);
  const c = copy(P);
  pill(ctx, c.kicker, 56, 52, P.before ? { bg: th.accent, color: '#fff', size: 20 } : { bg: th.sub(.07), color: th.sub(.65), size: 20 });
  brand(ctx, W - 56, 88, th, 'right', 26);

  const a = span(t, 0.55, 0.8);
  text(ctx, 'mi nivel', 70, 230, { size: 26, weight: 600, color: th.sub(.5), spacing: 0.04, align: 'left', alpha: a });
  text(ctx, c.hero, 64, 345, { size: 170, weight: 900, color: th.text, italic: true, align: 'left', alpha: a });
  text(ctx, c.heroName, 70, 470, { size: fit(ctx, c.heroName, 360, 44, 800), weight: 800, color: th.accent, italic: true, align: 'left', alpha: a });
  if (c.note) wrap(ctx, c.note, 70, 520, 330, 20, 600, th.sub(.5), a);

  const b = span(t, 0.7, 0.95);
  text(ctx, c.lineLabel.toLowerCase(), 70, 610, { size: 26, weight: 600, color: th.sub(.5), spacing: 0.04, align: 'left', alpha: b });
  wrap(ctx, c.line, 70, 650, 370, 40, 800, th.text, b);

  const d = span(t, 0.85, 1);
  text(ctx, c.cta, 70, 930, { size: 32, weight: 800, color: th.text, align: 'left', alpha: d });
  text(ctx, URL_TXT, 70, 978, { size: 24, weight: 600, color: th.accent, align: 'left', alpha: d });

  radar(ctx, 690, 560, 190, P, th, t, { labelSize: 22 });
}

function wrap(ctx, s, x, y, max, size, weight, color, alpha) {
  const words = s.split(' '); let line = '', yy = y;
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (textWidth(ctx, test, size, weight) > max && line) {
      text(ctx, line, x, yy, { size, weight, color, align: 'left', alpha }); line = w; yy += size * 1.2;
    } else line = test;
  }
  text(ctx, line, x, yy, { size, weight, color, align: 'left', alpha });
}

function renderSticker(ctx, W, H, P, th, t) {
  ctx.clearRect(0, 0, W, H);
  const c = copy(P);
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 2;
  radar(ctx, W / 2, 470, 270, P, th, t, { labelSize: 26 });
  const a = span(t, 0.55, 0.85);
  text(ctx, `${c.hero} · ${c.heroName}`, W / 2, 900, { size: fit(ctx, `${c.hero} · ${c.heroName}`, W - 120, 64, 900), weight: 900, color: '#fff', italic: true, alpha: a });
  text(ctx, `${c.lineLabel}: ${c.line}`, W / 2, 975, { size: fit(ctx, `${c.lineLabel}: ${c.line}`, W - 120, 30, 700), weight: 700, color: '#fff', alpha: a });
  ctx.restore();
  brand(ctx, W / 2, 1035, th, 'center', 30);
}

const RENDER = { story: renderStory, square: renderSquare, sticker: renderSticker };

const canvas = document.getElementById('card');
const ctx = canvas.getContext('2d');

function draw(t = 1) {
  const f = FORMATS[state.format];
  if (canvas.width !== f.W || canvas.height !== f.H) { canvas.width = f.W; canvas.height = f.H; }
  const th = state.format === 'sticker' ? STICKER : THEMES[state.theme];
  ctx.clearRect(0, 0, f.W, f.H);
  RENDER[state.format](ctx, f.W, f.H, currentProfiles(), th, t);
}

// ── Animación y exportación ─────────────────────────────

const DURATION = 4000;
let raf = 0;
function play(onFrame) {
  cancelAnimationFrame(raf);
  return new Promise(resolve => {
    const start = performance.now();
    const step = now => {
      // La animación ocupa el 80 % y deja la tarjeta quieta el resto, para que se lea.
      draw(Math.min(1, (now - start) / (DURATION * 0.8)));
      onFrame?.();
      if (now - start < DURATION) raf = requestAnimationFrame(step); else { draw(1); resolve(); }
    };
    raf = requestAnimationFrame(step);
  });
}

function blob(type = 'image/png') { return new Promise(r => canvas.toBlob(r, type)); }
function save(b, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const fileBase = () => `arete-${state.moment}-${state.format}`;

async function recordVideo() {
  const mime = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
  const stream = canvas.captureStream(30);
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8_000_000 });
  const chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  const done = new Promise(r => rec.onstop = r);
  rec.start();
  await play();
  rec.stop(); await done;
  return new File(chunks, `${fileBase()}.${mime.startsWith('video/mp4') ? 'mp4' : 'webm'}`, { type: mime.split(';')[0] });
}

async function busy(btn, fn) { btn.disabled = true; try { await fn(); } finally { btn.disabled = false; } }

document.getElementById('btnPlay').onclick = () => play();
document.getElementById('btnPng').onclick = async () => { draw(1); save(await blob(), `${fileBase()}.png`); };
document.getElementById('btnVideo').onclick = e => busy(e.currentTarget, async () => { const f = await recordVideo(); save(f, f.name); });
document.getElementById('btnShare').onclick = async () => {
  draw(1);
  const file = new File([await blob()], `${fileBase()}.png`, { type: 'image/png' });
  const c = copy(currentProfiles());
  const data = { files: [file], text: `${c.lineLabel}: ${c.line}. ${c.cta} https://${URL_TXT}` };
  if (navigator.canShare?.(data)) { try { await navigator.share(data); } catch {} }
  else save(file, file.name);
};

// ── Controles ───────────────────────────────────────────

const OPTIONS = {
  sample: Object.fromEntries(Object.entries(SAMPLES).map(([k, v]) => [k, v.name])),
  moment: MOMENTS,
  format: Object.fromEntries(Object.entries(FORMATS).map(([k, v]) => [k, v.name])),
  theme: { dark: 'Oscuro', light: 'Claro' },
};
for (const box of document.querySelectorAll('.chips')) {
  const key = box.dataset.key;
  for (const [val, label] of Object.entries(OPTIONS[key])) {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = label; b.dataset.val = val;
    b.onclick = () => {
      state[key] = val;
      try { localStorage.setItem('aretePerfilProto', JSON.stringify(state)); } catch {}
      sync(); play();
    };
    box.append(b);
  }
}
function sync() {
  for (const b of document.querySelectorAll('.chips button')) b.setAttribute('aria-pressed', state[b.parentElement.dataset.key] === b.dataset.val);
  document.querySelector('[data-key="theme"]').closest('fieldset').style.opacity = state.format === 'sticker' ? .4 : 1;
}

await document.fonts.load(`900 100px Inter`);
await document.fonts.load(`600 30px Inter`);
sync();
play();
</script>
</body>
</html>
